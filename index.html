<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prüfung Karten</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">

  <style>
    body { font-family: Arial, sans-serif; background:#f6f6f6; margin:0; }
    header { background:#fff; padding:15px; border-bottom:1px solid #ddd; }
    h1 { margin:0; font-size:20px; }
    select, button { font-size:16px; margin:5px 3px; padding:8px 12px; }
    main { padding:20px; }
    .card { background:#fff; padding:20px; border-radius:12px; min-height:200px; }
    .q { font-size:20px; }
    .a { display:none; margin-top:15px; border-top:1px dashed #ccc; padding-top:15px; }
  </style>
</head>
<body>

<header>
  <h1>Prüfung Karten</h1>
  <select id="deck"></select>
  <button onclick="next()">Nächste</button>
  <button onclick="show()">Antwort</button>
</header>

<main>
  <div class="card">
    <div class="q" id="q">Frage</div>
    <div class="a" id="a">Antwort</div>
  </div>
</main>

<script>
const decks = {
 "Tag 1 – COPD":[
["COPD ausschreiben","COPD bedeutet Chronic Obstructive Pulmonary Disease (chronisch-obstruktive Lungenerkrankung)."],
["COPD Definition","COPD ist eine chronische, fortschreitende Lungenerkrankung mit dauerhaft verengten Atemwegen und eingeschränkter Atmung."],
["Hauptursache der COPD","Die Hauptursache der COPD ist langjähriges Rauchen."],
["Weitere Ursachen der COPD","Passivrauchen, Schadstoffe, berufliche Belastungen und selten genetische Faktoren."],
["Warum ist COPD nicht heilbar?","Die strukturellen Veränderungen der Atemwege sind irreversibel."],
["4 Stadien der COPD","Stadium I leicht, Stadium II mittel, Stadium III schwer, Stadium IV sehr schwer."],
["Symptome Stadium I","Leichter Husten, eventuell Auswurf, kaum Einschränkungen."],
["Symptome Stadium II","Atemnot bei Belastung, zunehmender Husten und Auswurf."],
["Symptome Stadium III","Deutliche Atemnot bei geringer Belastung, häufige Exazerbationen."],
["Symptome Stadium IV","Atemnot in Ruhe, starke Einschränkung, evtl. Sauerstoffpflicht."],
["Pflegerische Maßnahme: Atemerleichternde Positionen","Sie erleichtern die Atmung und reduzieren Atemnot, z. B. Kutschersitz."],
["Pflegerische Maßnahme: Atemübungen","Atemübungen wie die Lippenbremse verlängern die Ausatmung und verhindern Bronchialkollaps."],
["Pflegerische Maßnahme: Bewegung","Angepasste Bewegung fördert die Lungenbelüftung und erhält Muskelkraft."],
["Was bedeutet PESR?","PESR steht für Problem, Ursache (Etiologie), Symptome und Ressourcen."],
["PESR Problem COPD","Atemnot bei Belastung."],
["PESR Ursache COPD","Verengte Atemwege durch chronische Entzündung."],
["PESR Symptome COPD","Kurzatmigkeit, schnelle Erschöpfung, Husten."],
["PESR Ressourcen COPD","Kooperationsbereitschaft und vorhandenes Krankheitsverständnis."],
["Stigmatisierung bei COPD","COPD wird häufig als selbstverschuldet wahrgenommen, was zu Schuldgefühlen führt."],
["Auswirkungen von Stigmatisierung","Rückzug, geringere Therapietreue und reduzierte Lebensqualität."],
["Pflegeziel bei Stigmatisierung","Förderung von Selbstmanagement und Stärkung der Ressourcen."],
["Beratung Definition","Beratung ist ein individueller, lösungsorientierter Prozess zur Entscheidungsfindung."],
["5 Rahmenbedingungen für Beratung","Geschützter Raum, Ruhe, ausreichend Zeit, störungsfreie Atmosphäre, Informationsmaterial."],
["Ablauf Beratungsgespräch","Kontaktaufnahme, Bedarfserhebung, Zieldefinition, Lösungsfindung, Durchführung, Evaluation."],
["Vorbehaltstätigkeiten Definition","Vorbehaltstätigkeiten sind Aufgaben, die ausschließlich von Pflegefachpersonen durchgeführt werden dürfen."]
 ],
 "Tag 2 – Salutogenese":[
["Salutogenese Definition","Salutogenese beschreibt die Entstehung und Erhaltung von Gesundheit."],
["Pathogenese Definition","Pathogenese beschreibt die Entstehung von Krankheit."],
["Unterschied Salutogenese / Pathogenese","Salutogenese ist ressourcenorientiert, Pathogenese defizitorientiert."],
["Krankheitskontinuum Erklärung","Gesundheit und Krankheit sind keine Gegensätze, sondern ein fließender Übergang."],
["Kohärenzgefühl Definition","Das Kohärenzgefühl beschreibt die Fähigkeit, Belastungen zu verstehen und zu bewältigen."],
["Komponente Verstehbarkeit","Die Situation ist für den Betroffenen erklärbar und nachvollziehbar."],
["Komponente Handhabbarkeit","Der Betroffene verfügt über Ressourcen zur Bewältigung."],
["Komponente Sinnhaftigkeit","Der Betroffene sieht einen Sinn im Umgang mit der Situation."],
["Kohärenzgefühl bei Tom","Tom braucht altersgerechte Erklärungen, um seine Erkrankung zu verstehen."],
["Widerstandsressourcen Definition","Widerstandsressourcen helfen Menschen, mit Stress und Krankheit umzugehen."],
["Persönliche Ressourcen bei Tom","Motivation und Lernfähigkeit des Kindes."],
["Soziale Ressourcen bei Tom","Mutter, Schule, medizinisches Fachpersonal."],
["Materielle Ressourcen bei Tom","Medikamente, Inhalationshilfen."],
["Information Definition","Information ist sachlich und standardisiert."],
["Beratung Definition","Beratung ist individuell und lösungsorientiert."],
["Anleitung Definition","Anleitung vermittelt praktische Fähigkeiten durch Üben."],
["Information bei Tom","Aufklärung über Asthma und Medikamente."],
["Beratung bei Tom","Unterstützung im Umgang mit Krankheit im Alltag."],
["Anleitung bei Tom","Richtiges Inhalieren üben."]
 ],
 "Tag 3 – Ethik & Notfall":[
["4 ethische Prinzipien","Autonomie, Nicht-Schaden, Fürsorge, Gerechtigkeit."],
["Autonomie Erklärung","Recht des Patienten auf Selbstbestimmung."],
["Nicht-Schaden Erklärung","Pflegehandlungen dürfen keinen Schaden verursachen."],
["Fürsorge Erklärung","Wohl des Patienten aktiv fördern."],
["Gerechtigkeit Erklärung","Gleiche und faire Behandlung aller Patienten."],
["Ethik im Notfall","Im Notfall kann Autonomie zugunsten des Lebensschutzes eingeschränkt sein."],
["Notfall Definition","Akute Lebensgefahr oder drohender schwerer Schaden."],
["ABCDE-Schema Zweck","Strukturierte Priorisierung lebenswichtiger Funktionen."],
["A – Airway","Sicherung der Atemwege."],
["B – Breathing","Beurteilung der Atmung."],
["C – Circulation","Überprüfung des Kreislaufs."],
["D – Disability","Neurologischer Status."],
["E – Exposure","Ganzkörperuntersuchung."],
["6-R-Regel","Richtiger Patient, Medikament, Dosierung, Zeit, Applikation, Dokumentation."],
["APGAR Zweck","Erste Einschätzung des Neugeborenen nach der Geburt."],
["APGAR Kriterien","Atmung, Puls, Grundtonus, Aussehen, Reflexe."],
["Frühgeburt Definition","Geburt vor der 37. Schwangerschaftswoche."],
["Komplikationen Frühgeborene","Atemprobleme, Infektionen, Temperaturinstabilität."],
["Rolle der Pflegefachkraft im Notfall","Priorisieren, Arzt informieren, Maßnahmen einleiten und dokumentieren."]
 ]
};

let deckNames = Object.keys(decks);
let d = 0, i = 0;

const deckSel = document.getElementById("deck");
deckNames.forEach((n,idx)=>{
  let o=document.createElement("option");
  o.value=idx; o.text=n; deckSel.add(o);
});

deckSel.onchange=()=>{ d=deckSel.value; i=0; draw(); };

function draw(){
 document.getElementById("q").innerText = decks[deckNames[d]][i][0];
 document.getElementById("a").innerText = decks[deckNames[d]][i][1];
 document.getElementById("a").style.display="none";
}

function next(){ i=(i+1)%decks[deckNames[d]].length; draw(); }
function show(){ document.getElementById("a").style.display="block"; }

draw();
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js?v=3");
}
</script>

</body>
</html>
